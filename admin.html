<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ओजस अपॉइंटमेंट रजिस्टर</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mukta:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=3">
<style>
  body { font-size: 16px; }
  .bar { background: var(--navy); color: #fff; }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
  .bar b { font: 800 1.4rem/1 var(--display); color: var(--gold); }
  .bar .btn { min-height: 40px; padding: 8px 14px; }
  .login { max-width: 400px; margin: 60px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px; display: grid; gap: 14px; }
  .login h1 { font-size: 1.7rem; }
  .err { color: var(--bad); font-weight: 600; margin: 0; }
  .tools { display: grid; gap: 12px; padding-block: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; min-height: 40px; }
  .seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .row .field { flex: 1 1 150px; }
  .row .field input, .row .field select { min-height: 42px; padding: 8px 10px; }
  .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .stat b { display: block; font: 800 1.8rem/1.1 var(--display); }
  .stat span { color: var(--muted); font-size: .9rem; }
  .day { margin-block: 18px; }
  .day h2 { font-size: 1.25rem; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 2px solid var(--gold); }
  .day h2 small { color: var(--muted); font-family: var(--body); font-weight: 500; font-size: .9rem; }
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 860px; background: var(--surface); }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .85rem; color: var(--muted); font-weight: 600; background: var(--soft); position: sticky; top: 0; }
  td.tok { font: 800 1.3rem/1 var(--display); width: 54px; }
  td small { color: var(--muted); display: block; }
  td select, td input { min-height: 36px; padding: 5px 8px; font-size: .92rem; }
  tr[data-s="तपासणी झाली"] td { opacity: .62; }
  tr[data-s="रद्द"] td, tr[data-s="आले नाहीत"] td { opacity: .5; }
  tr[data-s="रद्द"] .nm { text-decoration: line-through; }
  .pill { display: inline-block; font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--soft); }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
  .meta { color: var(--muted); font-size: .88rem; }
  .exports { padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; align-items: center; }
  .srv { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
  .srv i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); display: inline-block; }
  #report { display: none; }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff !important; color: #000 !important; font-size: 11px; }
    body > *:not(#report) { display: none !important; }
    #report { display: block !important; }
  }
  #report { font-family: var(--body); color: #000; }
  #report .rh { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid #14215c; padding-bottom: 6px; margin-bottom: 10px; }
  #report .rh h1 { font: 800 24px/1.1 var(--display); color: #14215c; margin: 0; }
  #report .rh p { margin: 2px 0 0; font-size: 12px; }
  #report h2 { font: 700 15px/1.2 var(--display); color: #14215c; margin: 14px 0 6px; }
  #report .sumgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  #report table { min-width: 0; width: 100%; border-collapse: collapse; background: #fff; font-size: 10.5px; }
  #report th, #report td { border: 1px solid #b9c0d8; padding: 3px 5px; text-align: left; vertical-align: top; opacity: 1 !important; text-decoration: none !important; }
  #report th { background: #e8ecf8 !important; color: #14215c; position: static; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #report tr { break-inside: avoid; }
  #report .foot { margin-top: 10px; font-size: 10px; color: #444; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="demoBar" class="demo-bar" hidden>डेमो मोड: कोणताही पासवर्ड चालेल. खरा डेटा जोडण्यासाठी config.js मध्ये API_URL टाका.</div>
<div class="bar"><div class="wrap"><b>ओजस · अपॉइंटमेंट रजिस्टर</b><button class="btn btn-ghost" id="logout" hidden>लॉगआउट</button></div></div>

<form class="login" id="loginForm">
  <h1>स्टाफ लॉगिन</h1>
  <p class="meta" style="margin:0">फक्त क्लिनिक स्टाफसाठी. लॉगिन 8 तास वैध राहते.</p>
  <div class="field"><label for="pw">पासवर्ड</label><input type="password" id="pw" autocomplete="current-password" required></div>
  <p class="err" id="loginErr" hidden></p>
  <button class="btn btn-gold" id="loginBtn">लॉगिन करा</button>
  <a href="index.html" class="meta">← वेबसाइटवर परत</a>
</form>

<main class="wrap" id="app" hidden>
  <div class="tools">
    <div class="seg" id="range">
      <button data-r="today" aria-pressed="true">आज</button>
      <button data-r="tomorrow">उद्या</button>
      <button data-r="week">पुढील 7 दिवस</button>
      <button data-r="past">मागील 30 दिवस</button>
      <button data-r="custom">तारीख निवडा</button>
    </div>
    <div class="row">
      <div class="field" id="customF" hidden><label for="from">पासून</label><input type="date" id="from"></div>
      <div class="field" id="customT" hidden><label for="to">पर्यंत</label><input type="date" id="to"></div>
      <div class="field"><label for="fDoc">डॉक्टर</label><select id="fDoc"><option value="">सर्व</option><option>डॉ. स्वप्निल काळणे</option><option>डॉ. अनुजा काळणे (बुरुकले)</option><option>कोणतेही</option></select></div>
      <div class="field"><label for="fStatus">स्थिती</label><select id="fStatus"><option value="">सर्व</option></select></div>
      <div class="field"><label for="q">शोधा</label><input id="q" placeholder="नाव, मोबाईल, ID, गाव"></div>
      <button class="btn btn-navy" id="refresh" style="min-height:42px">रिफ्रेश</button>
    </div>
    <div class="row exports">
      <span class="meta" style="font-weight:600">रिपोर्ट (निवडलेल्या तारखा व फिल्टरनुसार):</span>
      <button class="btn btn-gold" id="xlsx" style="min-height:42px">Excel रिपोर्ट (.xlsx)</button>
      <button class="btn btn-navy" id="pdf" style="min-height:42px">PDF रिपोर्ट</button>
      <button class="btn btn-ghost" id="csv" style="min-height:42px">CSV</button>
      <a class="btn btn-ghost" id="sheetLink" href="#" target="_blank" rel="noopener" style="min-height:42px" hidden>Google Sheet उघडा</a>
    </div>
    <div class="stats" id="stats"></div>
    <div class="meta" id="updated"></div>
  </div>
  <div id="list"></div>
</main>

<div id="report" aria-hidden="true"></div>

<script src="config.js?v=3"></script>
<script>
(function () {
  const A = window.OJAS, $ = s => document.querySelector(s);
  const STATUSES = ["प्रतीक्षेत", "निश्चित", "तपासणी झाली", "रद्द", "आले नाहीत"];
  const SESS_ORDER = { "सकाळ": 0, "दुपार": 1, "संध्याकाळ": 2 };
  const MONTHS = ["जानेवारी", "फेब्रुवारी", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टेंबर", "ऑक्टोबर", "नोव्हेंबर", "डिसेंबर"];
  const DAYS = ["रविवार", "सोमवार", "मंगळवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
  const fmt = iso => { const [y, m, d] = iso.split("-").map(Number); return DAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()] + ", " + d + " " + MONTHS[m - 1] + " " + y; };
  const add = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  STATUSES.forEach(s => $("#fStatus").insertAdjacentHTML("beforeend", `<option>${s}</option>`));
  if (A.isDemo) $("#demoBar").hidden = false;

  let token = null, rows = [], mode = "today", timer = null;
  try { const s = JSON.parse(sessionStorage.getItem("ojas_admin") || "null"); if (s && s.exp > Date.now()) token = s.token; } catch (e) {}

  function show() { $("#loginForm").hidden = !!token; $("#app").hidden = !token; $("#logout").hidden = !token; if (token) load(); }
  function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault(); const err = $("#loginErr"); err.hidden = true; $("#loginBtn").disabled = true;
    try {
      const r = await A.api({ action: "login", password: $("#pw").value });
      if (!r.ok) throw new Error(r.error);
      token = r.token; $("#pw").value = "";
      try { sessionStorage.setItem("ojas_admin", JSON.stringify({ token, exp: r.expires || Date.now() + 8 * 3600e3 })); } catch (e) {}
      show();
    } catch (ex) { err.textContent = (ex.message === "Failed to fetch" ? "सर्व्हरशी संपर्क झाला नाही. Apps Script Deploy मध्ये Who has access: Anyone आहे का ते तपासा." : (ex.message || "लॉगिन झाले नाही")); err.hidden = false; }
    finally { $("#loginBtn").disabled = false; }
  });
  $("#logout").onclick = () => { token = null; try { sessionStorage.removeItem("ojas_admin"); } catch (e) {} clearInterval(timer); show(); };

  function range() {
    const t = A.todayIST();
    if (mode === "today") return [t, t];
    if (mode === "tomorrow") return [add(t, 1), add(t, 1)];
    if (mode === "week") return [t, add(t, 6)];
    if (mode === "past") return [add(t, -30), t];
    return [$("#from").value || t, $("#to").value || $("#from").value || t];
  }
  $("#range").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    mode = b.dataset.r; $("#range").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("#customF").hidden = $("#customT").hidden = mode !== "custom";
    if (mode === "custom" && !$("#from").value) { $("#from").value = $("#to").value = A.todayIST(); }
    load();
  });
  ["#from", "#to"].forEach(s => $(s).addEventListener("change", load));
  ["#fDoc", "#fStatus"].forEach(s => $(s).addEventListener("change", render));
  $("#q").addEventListener("input", render);
  $("#refresh").onclick = load;

  async function load() {
    const [from, to] = range();
    try {
      const r = await A.api({ action: "list", token, from, to });
      if (!r.ok) { if (r.error === "LOGIN_REQUIRED") { toast("लॉगिनची वेळ संपली. पुन्हा लॉगिन करा."); $("#logout").click(); return; } throw new Error(r.error); }
      rows = r.rows;
      if (r.sheetUrl) { $("#sheetLink").href = r.sheetUrl; $("#sheetLink").hidden = false; }
      $("#updated").innerHTML = (A.isDemo ? "<b>डेमो मोड</b>" : '<span class="srv"><i></i>Google Sheet शी जोडलेले</span>') +
        " · शेवटचे अपडेट: " + new Date().toLocaleTimeString("mr-IN") + " · दर 1 मिनिटाला आपोआप रिफ्रेश · या कालावधीत " + rows.length + " नोंदी";
      render();
    } catch (ex) { toast(ex.message || "डेटा मिळाला नाही"); }
    clearInterval(timer); timer = setInterval(load, 60000);
  }

  function filtered() {
    const d = $("#fDoc").value, s = $("#fStatus").value, q = $("#q").value.trim().toLowerCase();
    return rows.filter(r => (!d || r.doctor === d) && (!s || r.status === s) &&
      (!q || [r.name, r.phone, r.id, r.village, r.service].join(" ").toLowerCase().includes(q)))
      .sort((a, b) => a.date.localeCompare(b.date) || (SESS_ORDER[a.session] - SESS_ORDER[b.session]) || a.token - b.token);
  }

  function render() {
    const list = filtered();
    const cnt = s => list.filter(r => r.status === s).length;
    $("#stats").innerHTML = [["एकूण", list.length], ["प्रतीक्षेत", cnt("प्रतीक्षेत") + cnt("निश्चित")], ["तपासणी झाली", cnt("तपासणी झाली")], ["रद्द", cnt("रद्द")], ["आले नाहीत", cnt("आले नाहीत")]]
      .map(([k, v]) => `<div class="stat"><b class="tab">${v}</b><span>${k}</span></div>`).join("");
    if (!list.length) { $("#list").innerHTML = `<div class="empty">या कालावधीत अपॉइंटमेंट नाहीत. रुग्णांनी वेबसाइटवरून बुक केल्यावर त्या येथे तारखेनुसार दिसतील.</div>`; return; }
    const byDate = {}; list.forEach(r => (byDate[r.date] = byDate[r.date] || []).push(r));
    $("#list").innerHTML = Object.keys(byDate).sort().map(d => {
      const g = byDate[d];
      return `<section class="day"><h2>${fmt(d)} <small>${g.length} अपॉइंटमेंट</small></h2><div class="tbl"><table>
        <thead><tr><th>टोकन</th><th>रुग्ण</th><th>मोबाईल</th><th>वेळ / डॉक्टर</th><th>कारण / त्रास</th><th>स्थिती</th><th>नोंद</th></tr></thead><tbody>
        ${g.map(r => `<tr data-s="${esc(r.status)}" data-id="${esc(r.id)}">
          <td class="tok tab">${esc(r.token)}</td>
          <td><b class="nm">${esc(r.name)}</b><small>${esc([r.age && r.age + " वर्षे", r.gender, r.village].filter(Boolean).join(" · "))}</small><small class="tab">${esc(r.id)}</small></td>
          <td class="tab">${esc(r.phone)}</td>
          <td><span class="pill">${esc(r.session)}</span><small>${esc(r.doctor)}</small></td>
          <td>${esc(r.service)}<small>${esc(r.problem)}</small></td>
          <td><select class="st" aria-label="स्थिती">${STATUSES.map(s => `<option${s === r.status ? " selected" : ""}>${s}</option>`).join("")}</select></td>
          <td><input class="nt" value="${esc(r.notes)}" placeholder="नोंद" aria-label="नोंद" maxlength="300"></td>
        </tr>`).join("")}</tbody></table></div></section>`;
    }).join("");
  }

  $("#list").addEventListener("change", async e => {
    const tr = e.target.closest("tr"); if (!tr) return;
    const row = rows.find(r => r.id === tr.dataset.id); if (!row) return;
    const patch = { action: "update", token, id: row.id };
    if (e.target.classList.contains("st")) patch.status = e.target.value;
    if (e.target.classList.contains("nt")) patch.notes = e.target.value;
    try {
      const r = await A.api(patch); if (!r.ok) throw new Error(r.error);
      if (patch.status) row.status = patch.status; if (patch.notes !== undefined) row.notes = patch.notes;
      render(); toast("जतन झाले");
    } catch (ex) { toast(ex.message || "जतन झाले नाही"); }
  });

  $("#csv").onclick = () => {
    const list = filtered(), [from, to] = range();
    const H = ["तारीख", "टोकन", "वेळ", "ID", "रुग्ण", "वय", "लिंग", "मोबाईल", "गाव", "डॉक्टर", "कारण", "त्रास", "स्थिती", "नोंद", "बुकिंग वेळ"];
    const q = v => { let s = String(v ?? ""); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const csv = "﻿" + [H, ...list.map(r => [r.date, r.token, r.session, r.id, r.name, r.age, r.gender, r.phone, r.village, r.doctor, r.service, r.problem, r.status, r.notes, r.bookedAt])]
      .map(a => a.map(q).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = `ojas-appointments_${from}_to_${to}.csv`; document.body.appendChild(a); a.click(); a.remove();
  };

  // ---------- रिपोर्ट: Excel (.xlsx) व PDF ----------
  const COLS = [["date", "तारीख"], ["token", "टोकन"], ["session", "वेळ"], ["id", "ID"], ["name", "रुग्णाचे नाव"], ["age", "वय"], ["gender", "लिंग"],
    ["phone", "मोबाईल"], ["village", "गाव"], ["doctor", "डॉक्टर"], ["service", "कारण"], ["problem", "त्रास"], ["status", "स्थिती"], ["notes", "नोंद"], ["bookedAt", "बुकिंग वेळ"]];
  function group(list, key) { const m = {}; list.forEach(r => m[r[key] || "—"] = (m[r[key] || "—"] || 0) + 1); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
  function summary(list) {
    return { byStatus: group(list, "status"), byDoctor: group(list, "doctor"), bySession: group(list, "session"), byService: group(list, "service"),
      byDate: Object.entries(list.reduce((m, r) => (m[r.date] = (m[r.date] || 0) + 1, m), {})).sort() };
  }
  function rangeLabel() { const [f, t] = range(); return f === t ? fmt(f) : fmt(f) + " ते " + fmt(t); }
  function fileBase() { const [f, t] = range(); return "Ojas_OPD_Report_" + f + (f === t ? "" : "_to_" + t); }
  function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("लायब्ररी लोड झाली नाही. इंटरनेट तपासा.")); document.head.appendChild(s); }); }

  $("#xlsx").onclick = async () => {
    const list = filtered(); if (!list.length) { toast("या कालावधीत नोंदी नाहीत"); return; }
    const btn = $("#xlsx"); btn.disabled = true;
    try {
      if (!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
      const wb = XLSX.utils.book_new(), S = summary(list);
      const data = [COLS.map(c => c[1]), ...list.map(r => COLS.map(([k]) => k === "token" ? Number(r[k]) : (r[k] ?? "")))];
      const ws = XLSX.utils.aoa_to_sheet(data);
      ws["!cols"] = [12, 7, 10, 11, 24, 6, 14, 13, 14, 26, 26, 30, 13, 24, 19].map(w => ({ wch: w }));
      ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: data.length - 1, c: COLS.length - 1 } }) };
      ws["!freeze"] = { xSplit: 0, ySplit: 1 };
      XLSX.utils.book_append_sheet(wb, ws, "अपॉइंटमेंट");
      const sum = [["ओजस क्लिनिक, तेल्हारा — OPD अपॉइंटमेंट रिपोर्ट"], ["कालावधी", rangeLabel()], ["तयार केले", new Date().toLocaleString("mr-IN")], ["एकूण अपॉइंटमेंट", list.length], []];
      const block = (title, arr) => { sum.push([title, "संख्या"]); arr.forEach(r => sum.push(r)); sum.push([]); };
      block("स्थितीनुसार", S.byStatus); block("डॉक्टरनुसार", S.byDoctor); block("वेळेनुसार", S.bySession);
      block("कारणानुसार", S.byService); block("तारखेनुसार", S.byDate.map(([d, n]) => [fmt(d), n]));
      const ws2 = XLSX.utils.aoa_to_sheet(sum); ws2["!cols"] = [{ wch: 34 }, { wch: 30 }];
      XLSX.utils.book_append_sheet(wb, ws2, "सारांश");
      XLSX.writeFile(wb, fileBase() + ".xlsx");
      toast("Excel रिपोर्ट डाउनलोड झाला");
    } catch (ex) { toast(ex.message || "Excel तयार झाला नाही"); }
    finally { btn.disabled = false; }
  };

  $("#pdf").onclick = () => {
    const list = filtered(); if (!list.length) { toast("या कालावधीत नोंदी नाहीत"); return; }
    const S = summary(list);
    const tbl = (title, arr) => `<div><h2>${title}</h2><table><tbody>${arr.map(([k, v]) => `<tr><td>${esc(k)}</td><td style="text-align:right;width:50px"><b>${v}</b></td></tr>`).join("")}</tbody></table></div>`;
    const filt = [$("#fDoc").value && "डॉक्टर: " + $("#fDoc").value, $("#fStatus").value && "स्थिती: " + $("#fStatus").value, $("#q").value.trim() && "शोध: " + $("#q").value.trim()].filter(Boolean).join(" · ");
    $("#report").innerHTML = `
      <div class="rh"><div><h1>ओजस क्लिनिक, तेल्हारा</h1><p>बाल व स्त्री रुग्णालय · OPD अपॉइंटमेंट रिपोर्ट</p></div>
        <div style="text-align:right"><p><b>कालावधी:</b> ${esc(rangeLabel())}</p>${filt ? `<p>${esc(filt)}</p>` : ""}<p><b>एकूण:</b> ${list.length} अपॉइंटमेंट</p></div></div>
      <div class="sumgrid">${tbl("स्थितीनुसार", S.byStatus)}${tbl("डॉक्टरनुसार", S.byDoctor)}${tbl("वेळेनुसार", S.bySession)}${tbl("तारखेनुसार", S.byDate.map(([d, n]) => [fmt(d), n]))}</div>
      <h2>सविस्तर यादी</h2>
      <table><thead><tr><th>तारीख</th><th>टोकन</th><th>वेळ</th><th>रुग्ण</th><th>वय/लिंग</th><th>मोबाईल</th><th>गाव</th><th>डॉक्टर</th><th>कारण / त्रास</th><th>स्थिती</th><th>नोंद</th></tr></thead><tbody>
      ${list.map(r => `<tr><td>${esc(r.date)}</td><td>${esc(r.token)}</td><td>${esc(r.session)}</td><td><b>${esc(r.name)}</b><br>${esc(r.id)}</td><td>${esc([r.age, r.gender].filter(Boolean).join(" / "))}</td><td>${esc(r.phone)}</td><td>${esc(r.village)}</td><td>${esc(r.doctor)}</td><td>${esc(r.service)}${r.problem ? "<br>" + esc(r.problem) : ""}</td><td>${esc(r.status)}</td><td>${esc(r.notes)}</td></tr>`).join("")}
      </tbody></table>
      <div class="foot"><span>शेगाव रोड, शेगाव नाका जवळ, तेल्हारा · 8799809360 · ojashospital2025@gmail.com</span><span>तयार केले: ${esc(new Date().toLocaleString("mr-IN"))}</span></div>`;
    const t = document.title; document.title = fileBase();
    toast("प्रिंट विंडोमध्ये 'Save as PDF' निवडा");
    setTimeout(() => { window.print(); document.title = t; }, 300);
  };

  show();
})();
</script>
</body>
</html>
